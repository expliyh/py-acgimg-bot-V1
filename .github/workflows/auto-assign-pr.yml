name: Auto-assign new pull requests

on:
  pull_request_target:
    types: [opened]

permissions:
  issues: write

jobs:
  assign:
    name: Assign repository owner
    runs-on: ubuntu-latest
    steps:
      - name: Assign repository owner
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          gh api \
            --method POST \
            "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/assignees" \
            --field "assignees[]=${REPOSITORY_OWNER}"
